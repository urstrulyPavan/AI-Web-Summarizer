<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 360px;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 12px;
      background-color: #f9f9f9;
      color: #333;
    }

    h2 {
      margin-top: 0;
      font-size: 18px;
      color: #1a73e8;
    }

    button {
      width: 100%;
      padding: 10px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    button:hover {
      background-color: #1557b0;
    }

    .stats-box {
      margin-top: 10px;
      padding: 8px;
      background-color: #e8f0fe;
      border-radius: 4px;
      font-size: 12px;
    }

    .section-title {
      font-weight: bold;
      margin-top: 12px;
      margin-bottom: 4px;
      font-size: 14px;
    }

    .content-box {
      background-color: white;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
      max-height: 220px;
      overflow-y: auto;
    }

    .quiz-item {
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
    }

    .quiz-question {
      font-weight: bold;
      color: #1a73e8;
      margin-bottom: 3px;
    }

    .quiz-answer {
      color: #2e7d32;
      line-height: 1.3;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <h2>AI Web Summarizer</h2>
  <button id="summarizeBtn">Summarize Current Page</button>

  <div id="results" class="hidden">
    <div class="stats-box">
      <div><strong>Words Extracted:</strong> <span id="wordCount">0</span></div>
      <div><strong>Processing Speed:</strong> <span id="speed">0</span> words/sec</div>
      <div><strong>Execution Time:</strong> <span id="timeMs">0</span> ms</div>
    </div>

    <div class="section-title">Summary:</div>
    <div id="summaryBox" class="content-box"></div>

    <div class="section-title">Comprehension Quiz (Practical Q&As):</div>
    <div id="quizBox" class="content-box"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
